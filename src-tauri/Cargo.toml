[package]
name = "listingforge"
version = "0.1.7"
description = "Local-first AI e-commerce image studio"
authors = ["ListingForge Contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "listingforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
keyring = "4.1.5"
ndarray = "0.17"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "ndarray"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
