name: Desktop build

on:
  workflow_dispatch:
  push:
    tags:
      - "build-*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: listingforge-windows-x64
            bundles: nsis
          - os: macos-15-intel
            artifact: listingforge-macos-intel
            bundles: app,dmg
          - os: macos-14
            artifact: listingforge-macos-apple-silicon
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - name: Verify Windows local interactions
        if: runner.os == 'Windows'
        run: npm run test:click
      - name: Verify Windows project creation
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib creates_project_with_a_chinese_name
      - run: npm run tauri:build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
